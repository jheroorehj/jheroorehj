<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 404" width="840" height="404" role="img" aria-label="yeong-ung-jang@jheroorehj terminal - about card">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3e"/>
      <stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#d2a8ff"/>
      <stop offset="0.5" stop-color="#79c0ff"/>
      <stop offset="1"   stop-color="#7ee787"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="body">
      <rect x="20" y="54" width="800" height="322"/>
    </clipPath>
    <clipPath id="cardclip">
      <rect x="44" y="102" width="752" height="160" rx="8"/>
    </clipPath>

    <style><![CDATA[
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco,
                     Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 15px;
      }
      .user   { fill: #7ee787; }
      .path   { fill: #e6edf3; }
      .sign   { fill: #8b949e; }
      .cmd    { fill: #e6edf3; }
      .str    { fill: #ffa657; }
      .name   { fill: #ffffff; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
      .handle { fill: #6e7681; font-size: 13px; }
      .out    { fill: #e6edf3; }
      .field  { fill: #d2a8ff; }
      .label  { fill: #6e7681; }
      .dim    { fill: #8b949e; }
      .hash   { fill: #e6edf3; }
      .cursor { fill: #e6edf3; }
      .cover  { fill: #1c1c1e; }
      .highlight { fill: #d2a8ff; font-weight: 600; }

      /* ============================================================
         loop = 20s.  Sequence finishes at ~5.3s, then holds ~14.7s.
         Percentages map to seconds as:  % = seconds x 5
         Typing speed = (end% - start%) / 5 / charCount seconds per char.
         Currently 70ms per char on both typed lines.
           line 1 : 12 chars over 4.2%  = 0.84s
           line 2 : 40 chars over 14%   = 2.80s
         ============================================================ */

      /* ---- typing: cover rect slides right, cursor rides its left edge ---- */
      .tp1 { animation: tp1 20s steps(12, end) infinite; }
      @keyframes tp1 {
        0%, 0.75%   { transform: translateX(0); }
        4.95%, 100% { transform: translateX(108px); }
      }
      .tp2 { animation: tp2 20s steps(40, end) infinite; }
      @keyframes tp2 {
        0%, 10.7%   { transform: translateX(0); }
        24.7%, 100% { transform: translateX(360px); }
      }

      /* ---- cursor visible only while its line is being typed ---- */
      .cur1 { animation: cur1 20s linear infinite; }
      @keyframes cur1 {
        0%, 0.65%    { opacity: 0; }
        0.75%, 4.95% { opacity: 1; }
        5.15%, 100%  { opacity: 0; }
      }
      .cur2 { animation: cur2 20s linear infinite; }
      @keyframes cur2 {
        0%, 10.6%    { opacity: 0; }
        10.7%, 24.7% { opacity: 1; }
        25%, 100%    { opacity: 0; }
      }

      /* ---- card: fade + slight rise ---- */
      .card { animation: card 20s linear infinite; }
      @keyframes card {
        0%, 5.45%   { opacity: 0; transform: translateY(6px); }
        6.45%, 100% { opacity: 1; transform: translateY(0); }
      }

      /* ---- staggered rows inside the card (0.1s apart) ---- */
      .r1 { animation: r1 20s linear infinite; }
      @keyframes r1 { 0%, 6.85% { opacity: 0; } 7.15%, 100% { opacity: 1; } }
      .r2 { animation: r2 20s linear infinite; }
      @keyframes r2 { 0%, 7.35% { opacity: 0; } 7.65%, 100% { opacity: 1; } }
      .r3 { animation: r3 20s linear infinite; }
      @keyframes r3 { 0%, 7.85% { opacity: 0; } 8.15%, 100% { opacity: 1; } }
      .r4 { animation: r4 20s linear infinite; }
      @keyframes r4 { 0%, 8.35% { opacity: 0; } 8.65%, 100% { opacity: 1; } }
      .r5 { animation: r5 20s linear infinite; }
      @keyframes r5 { 0%, 8.85% { opacity: 0; } 9.15%, 100% { opacity: 1; } }
      .r6 { animation: r6 20s linear infinite; }
      @keyframes r6 { 0%, 9.35% { opacity: 0; } 9.65%, 100% { opacity: 1; } }

      /* ---- trailing lines ---- */
      .ln7 { animation: ln7 20s linear infinite; }
      @keyframes ln7 { 0%, 10.15% { opacity: 0; } 10.45%, 100% { opacity: 1; } }
      .ln8 { animation: ln8 20s linear infinite; }
      @keyframes ln8 { 0%, 25.2% { opacity: 0; } 25.5%, 100% { opacity: 1; } }
      .ln9 { animation: ln9 20s linear infinite; }
      @keyframes ln9 { 0%, 26% { opacity: 0; } 26.3%, 100% { opacity: 1; } }

      /* ---- final blinking prompt ---- */
      .blink { animation: blink 1.06s steps(1, end) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .tp1, .tp2, .cur1, .cur2, .card,
        .r1, .r2, .r3, .r4, .r5, .r6,
        .ln7, .ln8, .ln9, .blink { animation: none; }
        .tp1 { transform: translateX(108px); }
        .tp2 { transform: translateX(360px); }
        .cur1, .cur2 { opacity: 0; }
      }
    ]]></style>
  </defs>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="20" y="16" width="800" height="360" rx="11" fill="#1c1c1e"/>
    <path d="M20 27a11 11 0 0 1 11-11h778a11 11 0 0 1 11 11v27H20z" fill="url(#bar)"/>
    <line x1="20" y1="54" x2="820" y2="54" stroke="#141416" stroke-width="1"/>
  </g>

  <!-- traffic lights -->
  <circle cx="44" cy="35" r="6.5" fill="#ff5f57"/>
  <circle cx="66" cy="35" r="6.5" fill="#febc2e"/>
  <circle cx="88" cy="35" r="6.5" fill="#28c840"/>

  <!-- title bar label -->
  <text class="mono" x="420" y="40" text-anchor="middle" font-size="12.5" fill="#9a9a9e">yeong-ung-jang — zsh — 100×30</text>

  <g clip-path="url(#body)" class="mono">

    <!-- line 1 : prompt + cat about.md -->
    <text class="user" x="44"  y="86" textLength="225" lengthAdjust="spacingAndGlyphs">yeong-ung-jang@jheroorehj</text>
    <text class="path" x="278" y="86" textLength="9"   lengthAdjust="spacingAndGlyphs">~</text>
    <text class="sign" x="287" y="86" textLength="9"   lengthAdjust="spacingAndGlyphs">%</text>
    <text class="cmd"  x="305" y="86" textLength="108" lengthAdjust="spacingAndGlyphs">cat about.md</text>
    <g transform="translate(305,86)">
      <g class="tp1">
        <rect class="cursor cur1" x="0" y="-13" width="9" height="18"/>
        <rect class="cover" x="9" y="-16" width="640" height="24"/>
      </g>
    </g>

    <!-- ============ about card ============ -->
    <g class="card">
      <rect x="44" y="102" width="752" height="160" rx="8" fill="#212124" stroke="#37373b" stroke-width="1"/>
      <g clip-path="url(#cardclip)">
        <rect x="44" y="102" width="4" height="160" fill="url(#accent)"/>
      </g>

      <!-- name + handle -->
      <g class="r1">
        <text class="name mono" x="68" y="134" textLength="151" lengthAdjust="spacingAndGlyphs">YEONG-UNG JANG</text>
        <text class="handle mono" x="772" y="133" text-anchor="end">@jheroorehj</text>
      </g>

      <!-- role -->
      <g class="r2">
        <text class="out"  x="68"  y="158" textLength="216" lengthAdjust="spacingAndGlyphs">Undergraduate Researcher</text>
        <text class="user" x="293" y="158" textLength="81"  lengthAdjust="spacingAndGlyphs">@P4C_Lab</text>
      </g>

      <line class="r3" x1="68" y1="175" x2="772" y2="175" stroke="#34343a" stroke-width="1"/>

      <!-- focus -->
      <g class="r4">
        <text class="label" x="68"  y="199" textLength="45"  lengthAdjust="spacingAndGlyphs">focus</text>
        <text class="field" x="140" y="199" textLength="234" lengthAdjust="spacingAndGlyphs">Human-Computer Interaction</text>
      </g>

      <!-- topics -->
      <g class="r5">
        <text class="label" x="68"  y="221" textLength="54"  lengthAdjust="spacingAndGlyphs">topics</text>
        <text class="out"   x="140" y="221" textLength="243" lengthAdjust="spacingAndGlyphs">reading · memory · behavior</text>
      </g>

      <!-- asking  (value column starts at x=140, safe up to 70 chars) -->
      <g class="r6">
        <text class="label" x="68"  y="243" textLength="54"  lengthAdjust="spacingAndGlyphs">asking</text>
        <text class="out"   x="140" y="243" textLength="432" lengthAdjust="spacingAndGlyphs">why the books we meant to read never become ours</text>
      </g>
    </g>
    <!-- ========== end about card ========== -->

    <!-- line 7 : prompt + git commit -->
    <g class="ln7">
      <text class="user" x="44"  y="292" textLength="225" lengthAdjust="spacingAndGlyphs">yeong-ung-jang@jheroorehj</text>
      <text class="path" x="278" y="292" textLength="9"   lengthAdjust="spacingAndGlyphs">~</text>
      <text class="sign" x="287" y="292" textLength="9"   lengthAdjust="spacingAndGlyphs">%</text>
      <text class="cmd"  x="305" y="292" textLength="126" lengthAdjust="spacingAndGlyphs">git commit -m&#160;</text>
      <text class="str"  x="431" y="292" textLength="234" lengthAdjust="spacingAndGlyphs">"push imagination to prod"</text>
    </g>
    <g transform="translate(305,292)">
      <g class="tp2">
        <rect class="cursor cur2" x="0" y="-13" width="9" height="18"/>
        <rect class="cover" x="9" y="-16" width="640" height="24"/>
      </g>
    </g>

    <!-- line 8 : commit output -->
    <g class="ln8">
      <text class="hash" x="44"  y="320" textLength="126" lengthAdjust="spacingAndGlyphs">[main 3f9a2c1]</text>
      <text x="179" y="320" class="mono">
        <tspan class="dim">1 file changed, </tspan>
        <tspan class="highlight">1 dream realized</tspan>
      </text>
    </g>

    <!-- line 9 : idle prompt -->
    <g class="ln9">
      <text class="user" x="44"  y="348" textLength="225" lengthAdjust="spacingAndGlyphs">yeong-ung-jang@jheroorehj</text>
      <text class="path" x="278" y="348" textLength="9"   lengthAdjust="spacingAndGlyphs">~</text>
      <text class="sign" x="287" y="348" textLength="9"   lengthAdjust="spacingAndGlyphs">%</text>
      <rect class="cursor blink" x="305" y="335" width="9" height="18"/>
    </g>

  </g>
</svg>
